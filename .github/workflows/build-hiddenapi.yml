name: Build hiddenapi flags

on:
  push:
    branches:
      - build-android-16.1-hiddenapi
    paths:
      - .github/workflows/build-hiddenapi.yml
  workflow_dispatch:
    inputs:
      aosp_branch:
        description: AOSP manifest branch to sync.
        required: true
        default: android16-qpr2-release
      lunch_target:
        description: AOSP lunch target for the build environment.
        required: true
        default: aosp_arm64-eng
      commit_result:
        description: Commit hiddenapi-flags.csv back to this branch if it changed.
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-hiddenapi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build hiddenapi-flags.csv
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      AOSP_DIR: /home/runner/work/_temp/aosp
      DIST_DIR: /home/runner/work/_temp/aosp-dist
      AOSP_BRANCH: ${{ inputs.aosp_branch || 'android16-qpr2-release' }}
      LUNCH_TARGET: ${{ inputs.lunch_target || 'aosp_arm64-eng' }}
      REPO_GROUPS: default,-darwin,-device,-cts,-tests
      SYNC_JOBS: 2
      TARGET_CSV: out/soong/hiddenapi/hiddenapi-flags.csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h

      - name: Install host packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            lib32ncurses-dev \
            lib32z1-dev \
            libbz2-dev \
            libc6-dev-i386 \
            libgl1-mesa-dev \
            libncurses-dev \
            libreadline-dev \
            libssl-dev \
            libxml2-utils \
            lz4 \
            rsync \
            unzip \
            x11proto-core-dev \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo tool
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /tmp/repo
          chmod a+x /tmp/repo
          /tmp/repo version

      - name: Sync AOSP
        run: |
          set -euo pipefail
          mkdir -p "$AOSP_DIR"
          cd "$AOSP_DIR"
          /tmp/repo init \
            --partial-clone \
            --clone-filter=blob:none \
            --depth=1 \
            --groups="$REPO_GROUPS" \
            --no-clone-bundle \
            -u https://android.googlesource.com/platform/manifest \
            -b "$AOSP_BRANCH"
          sync_aosp_once() {
            /tmp/repo sync \
              --current-branch \
              --fail-fast \
              --force-sync \
              --no-clone-bundle \
              --no-tags \
              --optimized-fetch \
              -j"$1" &
            local sync_pid="$!"
            local elapsed=0
            while kill -0 "$sync_pid" 2>/dev/null; do
              sleep 60
              elapsed=$((elapsed + 60))
              echo "repo sync still running after ${elapsed}s"
              df -h "$AOSP_DIR"
            done
            wait "$sync_pid"
          }
          if ! sync_aosp_once "$SYNC_JOBS"; then
            df -h
            df -ih
            du -sh "$AOSP_DIR" "$AOSP_DIR/.repo" 2>/dev/null || true
            sync_aosp_once 1
          fi

      - name: Record AOSP revision
        run: |
          set -euo pipefail
          {
            echo "aosp_branch=$AOSP_BRANCH"
            echo "lunch_target=$LUNCH_TARGET"
            echo "manifest_revision=$(git -C "$AOSP_DIR/.repo/manifests" rev-parse HEAD)"
            echo "manifest_subject=$(git -C "$AOSP_DIR/.repo/manifests" log -1 --format=%s)"
            echo "synced_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee "$GITHUB_WORKSPACE/aosp-hiddenapi-build.txt"

      - name: Build hiddenapi flags
        run: |
          set -euo pipefail
          cd "$AOSP_DIR"
          source build/envsetup.sh
          lunch "$LUNCH_TARGET"
          m -j"$(nproc)" "$TARGET_CSV"
          cp "$TARGET_CSV" "$GITHUB_WORKSPACE/hiddenapi-flags.csv"
          sha256sum "$GITHUB_WORKSPACE/hiddenapi-flags.csv" | tee -a "$GITHUB_WORKSPACE/aosp-hiddenapi-build.txt"

      - name: Upload hiddenapi flags
        uses: actions/upload-artifact@v4
        with:
          name: hiddenapi-flags-${{ env.AOSP_BRANCH }}
          path: |
            hiddenapi-flags.csv
            aosp-hiddenapi-build.txt
          if-no-files-found: error

      - name: Commit generated flags
        if: ${{ github.event_name == 'push' || inputs.commit_result }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hiddenapi-flags.csv
          if git diff --cached --quiet; then
            echo "hiddenapi-flags.csv is unchanged."
            exit 0
          fi
          git commit -m "Android 16.1"
          git push origin "HEAD:${{ github.ref_name }}"
